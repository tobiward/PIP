<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <!-- robot -->
    <g id="robot">
      <line x1="20" y1="2" x2="20" y2="9" stroke="#7aa7d8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="20" cy="3" r="3" fill="#f59e9e"/>
      <rect x="8" y="9" width="24" height="17" rx="6" fill="#7aa7d8"/>
      <circle cx="15" cy="17" r="3" fill="#fff"/><circle cx="25" cy="17" r="3" fill="#fff"/>
      <rect x="10" y="28" width="20" height="14" rx="5" fill="#9cc0e6"/>
      <rect x="4" y="30" width="5" height="9" rx="2.5" fill="#7aa7d8"/><rect x="31" y="30" width="5" height="9" rx="2.5" fill="#7aa7d8"/>
    </g>
    <!-- car -->
    <g id="car">
      <path d="M12 16 Q15 6 24 6 H32 Q38 6 40 16 Z" fill="#f59e9e"/>
      <rect x="2" y="15" width="44" height="13" rx="6" fill="#ef7b7b"/>
      <rect x="17" y="9" width="8" height="6" rx="2" fill="#fff" opacity=".8"/><rect x="28" y="9" width="8" height="6" rx="2" fill="#fff" opacity=".8"/>
      <circle cx="13" cy="29" r="5.5" fill="#5b5040"/><circle cx="36" cy="29" r="5.5" fill="#5b5040"/>
      <circle cx="13" cy="29" r="2" fill="#ddd"/><circle cx="36" cy="29" r="2" fill="#ddd"/>
    </g>
    <!-- plane -->
    <g id="plane">
      <rect x="2" y="16" width="44" height="10" rx="5" fill="#86c99a"/>
      <path d="M18 18 L28 2 H33 L29 18 Z" fill="#5fb27a"/>
      <path d="M18 24 L28 40 H33 L29 24 Z" fill="#5fb27a"/>
      <path d="M4 17 L2 7 H7 L12 17 Z" fill="#5fb27a"/>
      <circle cx="36" cy="21" r="2" fill="#fff"/><circle cx="30" cy="21" r="2" fill="#fff"/><circle cx="24" cy="21" r="2" fill="#fff"/>
    </g>
    <!-- rainbow -->
    <g id="rainbow" fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M4 30 A20 20 0 0 1 44 30" stroke="#f08a8a"/>
      <path d="M9 30 A15 15 0 0 1 39 30" stroke="#f6c26b"/>
      <path d="M14 30 A10 10 0 0 1 34 30" stroke="#8fcf8f"/>
      <path d="M19 30 A5 5 0 0 1 29 30" stroke="#86b4ea"/>
      <circle cx="6" cy="31" r="4" fill="#fff" stroke="none"/><circle cx="42" cy="31" r="4" fill="#fff" stroke="none"/>
    </g>
    <!-- pumpkin -->
    <g id="pumpkin">
      <path d="M20 9 Q19 3 24 1" stroke="#6f8f3a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="13" cy="22" rx="9" ry="12" fill="#f39a4a"/>
      <ellipse cx="27" cy="22" rx="9" ry="12" fill="#f39a4a"/>
      <ellipse cx="20" cy="22" rx="8" ry="13" fill="#f7ab62"/>
    </g>
    <!-- helicopter -->
    <g id="heli">
      <line x1="6" y1="4" x2="38" y2="4" stroke="#8a7a5c" stroke-width="3" stroke-linecap="round"/>
      <line x1="22" y1="4" x2="22" y2="10" stroke="#8a7a5c" stroke-width="3"/>
      <ellipse cx="22" cy="20" rx="13" ry="10" fill="#b48ee6"/>
      <path d="M33 18 H48 L50 13" stroke="#b48ee6" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M14 18 A8 6 0 0 1 22 13 V20 H14 Z" fill="#fff" opacity=".8"/>
      <line x1="12" y1="34" x2="32" y2="34" stroke="#8a7a5c" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="29" x2="16" y2="34" stroke="#8a7a5c" stroke-width="2"/><line x1="28" y1="29" x2="28" y2="34" stroke="#8a7a5c" stroke-width="2"/>
    </g>
  </defs>
  <g opacity=".33">
    <use href="#robot" transform="translate(20 18) rotate(-10 20 22)"/>
    <use href="#car" transform="translate(130 40) rotate(6 24 20)"/>
    <use href="#plane" transform="translate(240 14) rotate(-14 24 21)"/>
    <use href="#rainbow" transform="translate(60 120) rotate(8 24 20)"/>
    <use href="#pumpkin" transform="translate(178 125) rotate(-8 20 20)"/>
    <use href="#heli" transform="translate(262 112) rotate(10 25 20)"/>
    <use href="#plane" transform="translate(14 222) rotate(12 24 21)"/>
    <use href="#pumpkin" transform="translate(112 240) rotate(10 20 20)"/>
    <use href="#robot" transform="translate(205 220) rotate(8 20 22)"/>
    <use href="#car" transform="translate(262 270) rotate(-8 24 20)"/>
  </g>
</svg>
